name: Build and Release Python EXE

# يعمل تلقائياً عند رفع كود على main، أو يمكنك تشغيله يدوياً
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# إعطاء صلاحية لإنشاء Release
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest # خادم ويندوز لإنشاء ملف exe

    steps:
      # 1. تحميل كود المستودع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. تثبيت بايثون في الخادم
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. تثبيت PyInstaller واكتشاف المكتبات تلقائياً وتثبيتها
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pipreqs
          
          # فحص وتثبيت المكتبات المطلوبة للسكريبت
          if (Test-Path "requirements.txt") {
              pip install -r requirements.txt
          } else {
              pipreqs . --force
              if (Test-Path "requirements.txt") {
                  pip install -r requirements.txt
              }
          }

      # 4. تحويل السكريبت لملف EXE مدمج (Onefile)
      - name: Compile to EXE with PyInstaller
        run: |
          # نستخدم --onefile لدمج كل المكتبات في ملف واحد
          pyinstaller --noconfirm --onefile --clean number6.py

      # 5. إنشاء الـ Release ورفع الملف التنفيذي
      - name: Create Release and Upload EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "إصدار البرنامج رقم #${{ github.run_number }}"
          body: "تم بناء ملف الـ EXE ودمج المكتبات تلقائياً عبر GitHub Actions."
          files: dist/number6.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
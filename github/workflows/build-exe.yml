name: Build Python to EXE (Windows)

# هنا التعديل: هيشتغل تلقائياً عند الرفع (push) + يدوي لو ضغطت الزر
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:    # سيبها جنبها عشان يظهرلك الزر برضه لو عايز تشغله بإيدك

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Python Script
        run: |
          curl -s -L -o number6.py https://raw.githubusercontent.com/Ahmed-Hassan2006/pythonn/main/number6.py

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Compile to EXE
        run: |
          pyinstaller --onefile --clean number6.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app
          path: dist/number6.exe